name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strategy coverage check
        run: npm run check-strategy
      - run: npm run smoke:tokens
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - name: Consumer type-check (skipLibCheck:false against packed types)
        run: npm run consumer-type-check

  # Report-only: records the design-detector bar against docs/design-baseline.json.
  # Never fails the build; findings are printed in the job summary.
  design-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Serve Storybook
        run: python3 -m http.server 6007 -d projects/ui/storybook-static > /dev/null 2>&1 &
      - name: Design scan (report only)
        shell: bash
        run: npm run design:scan -- --storybook http://127.0.0.1:6007 | tee -a "$GITHUB_STEP_SUMMARY"

  # Report-only: phone conformance (docs/PHONE-CONTRACT.md) against the built app-layout stories.
  # Violations are summarised in the job summary and never fail the build; gating comes later
  # (PHONE_CONFORMANCE=gate) once the violations are fixed.
  phone-conformance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Phone conformance (report only)
        run: npm run test:phone
