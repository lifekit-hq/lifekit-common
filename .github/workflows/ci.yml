name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The baseline update workflow starts CI on the branch it commits to (a push made with the
  # workflow token does not).
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# @carbon/styles (a tokens devDependency) runs IBM's telemetry postinstall; keep it off in CI.
env:
  IBM_TELEMETRY_DISABLED: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strategy coverage check
        run: npm run check-strategy
      - run: npm run smoke:tokens
      - run: npm run lint
      - name: Design drift (zero tolerance)
        run: npm run check:drift
      - name: Icon set is current (the generated Lucide subset behind cmn-icon)
        run: npm run check:icons
      - name: Story states (justified gaps in docs/story-states-baseline.json)
        run: npm run check:story-states
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - name: Consumer type-check (skipLibCheck:false against packed types)
        run: npm run consumer-type-check

  # Gate: the design detector over source and every story (light + dark). Any finding not justified
  # in docs/design-baseline.json fails the build; the summary lands in the job summary.
  design-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.impeccable
          key: impeccable-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}
      - run: npm run build-storybook
      - name: Serve Storybook
        run: python3 -m http.server 6007 -d projects/ui/storybook-static > /dev/null 2>&1 &
      - name: Design scan
        shell: bash
        run: |
          set -o pipefail
          npm run design:scan -- --storybook http://127.0.0.1:6007 | tee -a "$GITHUB_STEP_SUMMARY"

  # Gate: phone conformance (docs/PHONE-CONTRACT.md) against the built Storybook stories. Any
  # violation fails the build, except the advisory checks (touch-sized controls in the tablet and
  # landscape chrome), which are only summarised in the job summary.
  phone-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Phone conformance
        run: npm run test:phone
        env:
          PHONE_CONFORMANCE: gate

  # Gate: accessibility (WCAG 2.2 AA). axe-core over every story in light and dark; a serious or
  # critical violation fails the build unless projects/ui/e2e/a11y/a11y-exceptions.json lists it.
  # Sharded so the sweep of the whole catalog stays a few minutes of wall time.
  a11y:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Accessibility (axe)
        run: npm run test:a11y -- --shard=${{ matrix.shard }}/4

  # Gate: screen baselines (docs/SCREEN-BASELINES.md). The reference app's screens at 390 and 1280,
  # light and dark, against the Linux baselines in the repository. A screen that drifts, or has no
  # baseline yet, fails the build; the actual, expected and diff images are uploaded with the report.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Screen baselines
        run: npm run test:screens
      - name: Upload the diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen-baseline-diff
          path: |
            projects/ui/e2e/screens/.output
            projects/ui/playwright-report
          if-no-files-found: ignore

  # Gate: route scan (docs/ROUTE-SCAN.md). The design judge and axe-core over the golden screens of
  # the page templates, at 390 and 1280, light and dark, with no exceptions. The pinned impeccable
  # engine is downloaded once and cached.
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.impeccable
          key: impeccable-${{ hashFiles('.claude/skills/impeccable/scripts/VERSION') }}
      - run: npm run build-storybook
      - name: Route scan
        run: npm run test:routes

  # A pull request that changes a baseline gets the screen before (base) and after (this branch)
  # attached as one comment, edited in place on every push and removed when the baselines no longer
  # differ. Same-repository branches only: a fork's token cannot comment.
  baseline-report:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/baseline-report
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
