name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strategy coverage check
        run: npm run check-strategy
      - run: npm run smoke:tokens
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook
      - name: Consumer type-check (skipLibCheck:false against packed types)
        run: npm run consumer-type-check
