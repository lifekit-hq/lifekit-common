name: Update screen baselines

# The one step that rewrites this repository's screen baselines (docs/SCREEN-BASELINES.md). Run it
# from the Actions tab on a branch whose screens changed on purpose: it renders them on the CI
# runner, the machine every later run compares on, commits the changed images to that branch,
# starts CI on it and posts the before and after images on the branch's pull request. It never runs
# on its own and never on main. The work is the reusable `screen-baselines.yml`, which any lifekit
# app calls the same way.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/screen-baselines.yml
    with:
      command: npm run test:screens:update
      baselines: projects/ui/e2e/screens
      build-command: npm run build-storybook
      lifekit-common-ref: ${{ github.sha }}
