name: Update screen baselines

# The one step that rewrites the screen baselines (docs/SCREEN-BASELINES.md). Run it from the
# Actions tab on a branch whose screens changed on purpose: it renders them on the CI runner, the
# machine every later run compares on, commits the changed images to that branch and starts CI on
# it and posts the before and after images on the branch's pull request (a push made with the workflow
# token does not start the pull request run, so this does it itself). It never runs on its own and
# never on main.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  update:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Render the baselines
        run: npm run test:screens:update
      - name: Commit the changed baselines
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -A -- 'projects/**/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then
            echo "No baseline changed." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): update screen baselines"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find the pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,baseRefOid --jq '.[0] // empty')"
          if [ -z "$pr" ]; then
            echo "No open pull request for $BRANCH; the report is posted when one is opened." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefOid <<<"$pr")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/baseline-report
        if: steps.pr.outputs.number != ''
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr: ${{ steps.pr.outputs.number }}
          base: ${{ steps.pr.outputs.base }}
          head: ${{ steps.commit.outputs.head }}
