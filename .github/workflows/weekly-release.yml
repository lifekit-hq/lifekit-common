name: Weekly Release

# Cuts a release once a week by merging the Release Please PR that accumulates on main.
# Release Please keeps that PR current on every merge; this job just lands it on a cadence.
# No releasable commits since the last release → no PR → the job no-ops.
#
# Delegates to the lifekit-hq/.github reusable template, which merges with the release-bot
# app token — a real push to main that fires release-please.yml's own push trigger, so no
# explicit dispatch back to it is needed.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: # manual "release now"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    uses: lifekit-hq/.github/.github/workflows/weekly-release.yml@v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
