name: Release Please

# Maintains the release PR (version bump + CHANGELOG, all packages lockstep) via the
# lifekit-hq/.github reusable template, on the release-bot app token so the release
# PR gets real CI. Once that PR merges, tags the release and publishes @lifekit-hq/*
# to GitHub Packages.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: lifekit-hq/.github/.github/workflows/release-please.yml@v1
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@lifekit-hq"
      - run: npm ci
      - name: Build Angular packages
        run: npm run build
      - name: Publish all packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish ./dist/lifekit-hq/charts-core
          npm publish ./dist/lifekit-hq/ui
          npm publish ./dist/lifekit-hq/core
          npm publish ./projects/tokens
          npm publish ./projects/config
