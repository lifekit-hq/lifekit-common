<!doctype html>
<!-- A dashboard composed the way `cmn-page kind="overview"` composes it: the title on the main
     column's edge, a card grid and a list in the main column, and a 320px rail of secondary blocks
     beside it from 1280px up (under it, on the same edge, below that). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>overview screen</title>
    <style>
      body {
        color: #0f1a1f;
        margin: 0;
        font: 14px/1.5 sans-serif;
      }
      main {
        display: block;
      }
      .frame {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      .columns {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      [data-cmn-page-column] {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .stat {
        border: 1px solid #7d8c93;
        padding: 16px;
      }
      h2 {
        margin: 0;
        padding: 8px 4px;
        font-size: 14px;
      }
      .card {
        border: 1px solid #7d8c93;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
      }
      @media (min-width: 768px) {
        .frame {
          padding: 32px;
        }
        h1 {
          margin-bottom: 24px;
        }
        .stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (min-width: 1280px) {
        .columns {
          flex-direction: row;
          align-items: flex-start;
        }
        .columns > [data-cmn-page-column]:first-child {
          flex: 1;
          min-width: 0;
        }
        [data-cmn-page-column='rail'] {
          width: 320px;
          flex-shrink: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div data-cmn-page="overview">
        <div class="frame">
          <h1 data-cmn-page-title>This week</h1>
          <div class="columns">
            <div data-cmn-page-column>
              <div class="stats">
                <div class="stat">Due this week<br />7</div>
                <div class="stat">Overdue<br />2</div>
                <div class="stat">Done<br />12</div>
                <div class="stat">Shared<br />5</div>
              </div>
              <section>
                <h2>Due today · 2</h2>
                <div class="card">
                  <div class="row"><span>Book the boiler service</span></div>
                  <div class="row"><span>Call the dentist</span></div>
                </div>
              </section>
            </div>
            <div data-cmn-page-column="rail">
              <section>
                <h2>Coming up</h2>
                <div class="card">
                  <div class="row"><span>Parents' evening</span></div>
                  <div class="row"><span>Bin day</span></div>
                </div>
              </section>
              <section>
                <h2>People</h2>
                <div class="card">
                  <div class="row"><span>Sam Morgan</span></div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
